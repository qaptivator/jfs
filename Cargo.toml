[package]
name = "jfs"
version = "0.1.0"
edition = "2024"
description = "Windows Java version manager for Java fans"
license = "MIT"
repository = "https://github.com/qaptivator/jfs"
readme = "README.md"
authors = ["acdev"]
rust-version = "1.85"

[[bin]]
name = "jfs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2.2"
junction = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
