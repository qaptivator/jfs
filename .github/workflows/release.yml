name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/jfs.exe jfs-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jfs-x86_64.exe
          path: jfs-x86_64.exe

  build-arm64:
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Stage
        shell: pwsh
        run: Copy-Item target/aarch64-pc-windows-msvc/release/jfs.exe jfs-aarch64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jfs-aarch64.exe
          path: jfs-aarch64.exe

  release:
    needs: [build-x64, build-arm64]
    if: always() && needs.build-x64.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jfs-x86_64.exe
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: jfs-aarch64.exe
          path: dist
      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/jfs-x86_64.exe
            dist/jfs-aarch64.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: false
